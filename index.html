<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raw-Plot</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <header class="titlebar" data-tauri-drag-region>
        <div class="traffic">
          <button id="win-close" class="window-btn" title="閉じる" aria-label="閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7l10 10M17 7L7 17" />
            </svg>
          </button>
          <button id="win-min" class="window-btn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 15.5h10" />
            </svg>
          </button>
          <button id="win-pin" class="window-btn pin-btn" title="常に手前に表示" aria-label="常に手前に表示">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 22v-5M9 8V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4M6 16l3-3V8h6v5l3 3H6z" />
            </svg>
          </button>
        </div>
        <span id="title" class="title"></span>
      </header>
      <main id="plot" class="plot"></main>
      <div class="grip grip-t" data-resize="t"></div>
      <div class="grip grip-r" data-resize="r"></div>
      <div class="grip grip-c" data-resize="c"></div>
    </div>
    <footer class="toolbar">
      <button id="open-btn" class="icon-btn" title="ファイルを開く">
        <svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v10H3z" /></svg>
      </button>
      <div class="tools" id="tools" hidden>
        <span class="sep"></span>
        <button id="home-btn" class="icon-btn" title="全体表示にリセット">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7" /><path d="M5 10v9h14v-9" /></svg>
        </button>
        <span class="sep"></span>
        <button id="undo-btn" class="icon-btn" title="戻る">
          <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5" /><path d="M4 12h10a6 6 0 0 1 6 6" /></svg>
        </button>
        <span class="sep"></span>
        <button id="redo-btn" class="icon-btn" title="進む">
          <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5" /><path d="M20 12H10a6 6 0 0 0-6 6" /></svg>
        </button>
        <span class="sep"></span>
        <button id="pan-btn" class="icon-btn" title="ドラッグで移動">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" /></svg>
        </button>
        <span class="sep"></span>
        <button id="zoom-btn" class="icon-btn" title="範囲ズーム">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
        </button>
        <span class="sep"></span>
        <button id="line-btn" class="icon-btn" title="折れ線">
          <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 6" /></svg>
        </button>
        <span class="sep"></span>
        <button id="scatter-btn" class="icon-btn" title="散布図">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="1.8" /><circle cx="11" cy="9" r="1.8" /><circle cx="15" cy="14" r="1.8" /><circle cx="19" cy="6" r="1.8" /></svg>
        </button>
        <span class="sep"></span>
        <label class="axis">X<select id="x-select"></select></label>
        <span class="sep"></span>
        <label class="axis">Y<select id="y-select"></select></label>
      </div>
      <span id="status" class="status"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
