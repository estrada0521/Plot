<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axes</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="popup-body">
    <div class="popup-shell">
      <header class="titlebar">
        <div class="traffic">
          <button id="win-close" class="window-btn" title="閉じる" aria-label="閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
          </button>
          <button id="win-min" class="window-btn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15.5h10" /></svg>
          </button>
        </div>
        <span class="title" id="axes-title">Axes</span>
      </header>
      <main class="axes-panel">
        <div class="axes-grid axes-head">
          <span>Axis</span>
          <span>Data</span>
          <span>Min</span>
          <span>Max</span>
          <span></span>
        </div>
        <div class="axes-grid axes-row">
          <span class="axes-axis">X</span>
          <select id="x-axis-select"></select>
          <input id="x-min-input" class="axes-range-input" type="number" />
          <input id="x-max-input" class="axes-range-input" type="number" />
          <span></span>
        </div>
        <div id="y-axis-list" class="axes-list"></div>
        <div id="twin-y-row" class="axes-grid axes-row axes-twin-row">
          <span class="axes-axis">Y right</span>
          <span id="twin-y-name" class="axes-twin-name"></span>
          <input id="twin-y-min-input" class="axes-range-input axes-twin-input" type="number" />
          <input id="twin-y-max-input" class="axes-range-input axes-twin-input" type="number" />
          <span></span>
        </div>
      </main>
      <footer class="filter-actions">
        <button id="add-y-btn" class="filter-btn filter-btn-reset">+ Y</button>
        <button id="apply-btn" class="filter-btn filter-btn-primary">Apply</button>
        <button id="close-btn" class="filter-btn">Close</button>
      </footer>
    </div>
    <script type="module" src="/src/axes.ts"></script>
  </body>
</html>
