<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="popup-body">
    <div class="popup-shell">
      <header class="titlebar" data-tauri-drag-region>
        <div class="traffic">
          <button id="win-close" class="window-btn" title="閉じる" aria-label="閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
          </button>
          <button id="win-min" class="window-btn" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15.5h10" /></svg>
          </button>
        </div>
        <span class="title" id="filter-title">Filter</span>
      </header>
      <main class="filter-list" id="filter-list"></main>
      <footer class="filter-actions">
        <button id="reset-btn" class="filter-btn filter-btn-reset">Reset</button>
        <button id="apply-btn" class="filter-btn filter-btn-primary">Apply</button>
        <button id="save-btn" class="filter-btn">Save…</button>
      </footer>
    </div>
    <script type="module" src="/src/filter.ts"></script>
  </body>
</html>
